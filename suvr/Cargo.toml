[package]
name = "suvr"
version = "0.1.0"
edition = "2021"
description = "SUVR 2D front-end: browses media and launches the 3D VR player per title."

[[bin]]
name = "suvr"
path = "src/main.rs"

[dependencies]
# UI 2D: egui replaces the hand-rolled CPU rasterizer (ui-draw.c/browser-ui.c),
# text layout, hit-testing and the on-screen keyboard. Runs inside the headset
# as a flat window; the VR compositor feeds it ordinary mouse/keyboard events.
eframe = "0.29"
egui = "0.29"
# Config + source payloads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for Jellyfin / WebDAV. No async runtime on purpose.
ureq = { version = "2", features = ["json"] }
# Thumbnails -> RGBA for egui textures.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# WebDAV / Jellyfin basic auth header.
base64 = "0.22"
# Logging facade (also used by eframe/winit); our own file logger captures it.
log = "0.4"

# ponytail: no tokio, no workspace, no custom widget crate. Add only when a
# second binary actually needs to share code.
